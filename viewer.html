<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Візуалізація AST міні-C</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; }
  #bar { padding: 10px; background: #eee; }
  #canvas { width: 100vw; height: calc(100vh - 50px); }
  .link { fill: none; stroke: #999; stroke-width: 1.5px; }
  .node circle { stroke: #333; stroke-width: 1.5px; cursor: pointer; }
  .node text { font-size: 12px; }
</style>
</head>
<body>
<div id="bar">
  Файл ast.json: <input type="file" id="file" accept=".json">
  <span> Клік по вузлу згортає/розгортає піддерево. Коліщатко: масштаб, перетягування: рух.</span>
</div>
<svg id="canvas"></svg>
<script>
const colors = {
  PROGRAM:"#444", FUNC:"#8e44ad", PARAMS:"#9b59b6", BLOCK:"#7f8c8d",
  IF:"#e67e22", WHILE:"#e67e22", FOR:"#e67e22", RETURN:"#c0392b",
  DECL:"#2980b9", ASSIGN:"#2980b9", EXPR_STMT:"#95a5a6",
  BINOP:"#27ae60", UNOP:"#27ae60", NUM:"#f1c40f", VAR:"#16a085",
  CALL:"#d35400", ARGS:"#d35400", EMPTY:"#bdc3c7"
};

const svg = d3.select("#canvas");
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.1, 4]).on("zoom", e => g.attr("transform", e.transform)));

function draw(data) {
  g.selectAll("*").remove();
  const root = d3.hierarchy(data);
  const tree = d3.tree().nodeSize([26, 150]);   // [висота між вузлами, відстань між рівнями]

  function update() {
    tree(root);
    const nodes = root.descendants();
    const links = root.links();

    g.selectAll(".link").data(links, d => d.target.id ??= Math.random())
      .join("path").attr("class", "link")
      .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

    const node = g.selectAll(".node").data(nodes, d => d.id ??= Math.random())
      .join(enter => {
        const n = enter.append("g").attr("class", "node");
        n.append("circle").attr("r", 7);
        n.append("text").attr("dy", 4);
        return n;
      })
      .attr("transform", d => `translate(${d.y},${d.x})`)
      .on("click", (e, d) => {
        if (d.children) { d._children = d.children; d.children = null; }
        else { d.children = d._children; d._children = null; }
        update();
      });

    node.select("circle")
      .attr("fill", d => colors[d.data.type] || "#ccc")
      .attr("stroke-dasharray", d => d._children ? "3,2" : null);
    node.select("text")
      .attr("x", d => (d.children || d._children) ? -12 : 12)
      .attr("text-anchor", d => (d.children || d._children) ? "end" : "start")
      .text(d => d.data.label ? `${d.data.type} ${d.data.label}` : d.data.type);
  }

  update();
  svg.call(d3.zoom().transform, d3.zoomIdentity.translate(80, window.innerHeight / 2));
}

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then(t => draw(JSON.parse(t)));
});
</script>
</body>
</html>
